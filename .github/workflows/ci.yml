# Continuous integration: lint, typecheck, test and build every part of Micky.
# Runs on pull requests and on pushes to branches other than main. Pushes to
# main run it through deploy.yml (workflow_call), so main is tested exactly once
# and nothing is deployed unless this passes.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches; never cancel a run that deploy.yml started.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  api:
    name: API (lint, typecheck, unit + e2e tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: micky
          POSTGRES_PASSWORD: micky
          POSTGRES_DB: micky_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U micky -d micky_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install ffmpeg (media processing tests)
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fontconfig
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: E2E tests
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://micky:micky@localhost:5432/micky_test
          TEST_REDIS_URL: redis://localhost:6379/1
      - name: Build
        run: npm run build

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npm run build

  verifier:
    name: Verifier (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/verifier/requirements*.txt
      # requirements-dev.txt has no torch: the tests don't need the AI model.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  e2e:
    name: Browser E2E (Playwright, whole stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: micky
          POSTGRES_PASSWORD: micky
          POSTGRES_DB: micky
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U micky -d micky"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # global-setup.ts drops and recreates this database, then migrates and seeds it.
      E2E_DATABASE_URL: postgresql://micky:micky@localhost:5432/micky_e2e
      E2E_REDIS_URL: redis://localhost:6379/13
      # The verifier runs from the runner's Python (installed below), without the AI model.
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/verifier/requirements*.txt
      - name: Install ffmpeg (worker previews, test clips)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fontconfig
      - name: Install verifier (no torch)
        run: pip install -r services/verifier/requirements.txt
      - name: Build API
        working-directory: apps/api
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Typecheck the tests
        working-directory: e2e
        run: npm run typecheck
      - name: Run the browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.stack/*.log
          retention-days: 7

  infra:
    name: Infra (compose, Caddyfile, shellcheck, actionlint, backups)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: micky
          POSTGRES_PASSWORD: micky
          POSTGRES_DB: micky
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U micky -d micky"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files
        run: |
          docker compose config --quiet
          mkdir -p /tmp/vm
          cp infra/docker-compose.prod.yml /tmp/vm/docker-compose.yml
          cp infra/Caddyfile /tmp/vm/Caddyfile
          sed -e 's/CHANGE_ME/placeholder/g' infra/.env.prod.example > /tmp/vm/.env
          docker compose --project-directory /tmp/vm -f /tmp/vm/docker-compose.yml config --quiet
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e WEB_DOMAIN=example.com -e API_DOMAIN=api.example.com -e ACME_EMAIL=ci@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: shellcheck
        run: shellcheck -x scripts/*.sh # preinstalled on GitHub's Ubuntu runners
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Backup encrypt/restore round trip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age rclone postgresql-client
          scripts/test-backups.sh

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: apps/api
            build-args: ""
          - image: web
            context: apps/web
            build-args: ""
          - image: verifier
            context: services/verifier
            build-args: PRELOAD_MODEL=false # CI only checks that it builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: false
          load: true
          tags: micky-${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - name: Smoke test the API image tools
        if: matrix.image == 'api'
        run: |
          docker run --rm --entrypoint sh micky-api:ci -c \
            'ffmpeg -hide_banner -filters | grep -q drawtext && ffprobe -version >/dev/null && fc-match -f "%{file}\n" "DejaVu Sans:bold" && test -f dist/worker.js && test -f dist/db/migrate.js && ls drizzle >/dev/null && id -u'
